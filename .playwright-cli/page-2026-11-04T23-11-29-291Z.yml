      - generic [ref=e219]:
        - generic [ref=e220]:
          - paragraph [ref=e221]: A two-player online game of tag written in Python with pygame for Computer Science 1. Two players connect to a server, one is randomly made the tagger, and the runner has to survive 100 seconds in an arena full of obstacles.
          - paragraph [ref=e222]: "There is no game engine or networking library underneath it: just raw TCP sockets, threads and the game's own player objects sent back and forth every frame."
          - list "Tools used" [ref=e223]:
            - listitem [ref=e224]: Python
            - listitem [ref=e225]: pygame
            - listitem [ref=e226]: socket
            - listitem [ref=e227]: threading
            - listitem [ref=e228]: pickle
        - generic [ref=e230]:
          - heading "How it works" [level=4] [ref=e231]
          - list [ref=e232]:
            - listitem [ref=e233]: A threaded TCP server accepts two clients and randomly picks which one is the tagger
            - listitem [ref=e234]: Every frame (25 fps) each client pickles its Player object, sends it to the server and gets the opponent's state back
            - listitem [ref=e235]: "Pixel-mask collision decides a tag: the tagger has to be mid-dash when the sprites overlap"
            - listitem [ref=e236]: The runner wins by surviving 100 seconds. Dash (J/Z) and roll (K/X) run on cooldowns
      - generic [ref=e237]:
        - img "The PyTag character run cycle, animated" [ref=e238]
        - paragraph [ref=e239]: "Controls: WASD or arrow keys to move, J or Z to dash, K or X to roll. Built for Computer Science 1, 2024-2025."
