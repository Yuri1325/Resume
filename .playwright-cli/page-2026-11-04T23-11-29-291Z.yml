      - generic [ref=e154]:
        - generic [ref=e155]:
          - paragraph [ref=e156]: A top-down survival game written in Java with Greenfoot for my final project. Slimes crawl in from every edge of the map and chase you down. Every slime your defenses destroy earns $1, and you spend it on more defenses before the horde wears through your five hearts.
          - paragraph [ref=e157]: "Building happens mid-fight on single keys: walls (C) start at $10 and cost $10 more with each one you place, turrets (X) cost $50 and land mines (Z) cost $10. The longer you survive the faster slimes spawn, and your score is how many seconds you lasted."
          - list "Tools used" [ref=e158]:
            - listitem [ref=e159]: Java
            - listitem [ref=e160]: Greenfoot
            - listitem [ref=e161]: Object-oriented design
        - generic [ref=e162]:
          - generic [ref=e163]:
            - heading "How it works" [level=4] [ref=e164]
            - list [ref=e165]:
              - listitem [ref=e166]: Every frame rolls a random number to decide whether a slime spawns. The roll's range shrinks each second, so spawns go from occasional to constant
              - listitem [ref=e167]: Up to four turrets fire on their own timers at 1, 2 or 3 shots a second. Two lock onto the oldest slime on the map and two onto the newest, and the fourth fires explosive rounds
              - listitem [ref=e168]: Turrets turn toward their target with atan2 on a small Vector class I wrote, and bullets fly along that heading
              - listitem [ref=e169]: Walls soak up five slimes before crumbling, and mines blow up the moment a slime steps on one
          - 'figure "The game''s class tree in Greenfoot: 14 actor classes and 2 worlds" [ref=e170]':
            - 'img "The game''s class tree in Greenfoot: 14 actor classes and 2 worlds" [ref=e171]'
      - region "From the source" [ref=e173]:
        - heading "From the source" [level=4] [ref=e174]
        - generic [ref=e175]:
          - figure [ref=e176]:
            - generic [ref=e177]:
              - strong [ref=e178]: Generator.java
              - text: The difficulty ramp. te counts up once a second to 195, shrinking the roll from 100 to 2.5. Rolls of 0 to 3 spawn a slime off one of the four edges, so spawns go from 4 in 100 frames to every frame.
            - code [ref=e180]: "if (timeElapsed>1){ int rngNum = ((int)(Math.random()*(100-(te*0.5)))); spawnSlime(rngNum); }"
          - figure [ref=e181]:
            - generic [ref=e182]:
              - strong [ref=e183]: TurretSpawner.java
              - text: Target selection. The later turrets aim at the newest slime, the first two at the oldest, so the defenses split their fire.
            - code [ref=e185]: "if((z.id==3)||(z.id==2)){ int max = slimeList.size()-1; z.setTargetLocal(new Vector(slimeList.get(max).getX(),slimeList.get(max).getY())); }else{ z.setTargetLocal(new Vector(slimeList.get(0).getX(),slimeList.get(0).getY())); }"
          - figure [ref=e186]:
            - generic [ref=e187]:
              - strong [ref=e188]: Turret.java + Vector.java
              - text: Aiming. Subtract the turret's position from the target's, turn the difference into an angle with atan2, and rotate the sprite to face it.
