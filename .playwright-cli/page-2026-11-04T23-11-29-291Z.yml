          - paragraph [ref=e257]: A k-nearest-neighbors classifier for handwritten digits. It loads the 60,000 training and 10,000 test images of MNIST from JSON, flattens each 28 by 28 image into a 784-number vector and trains OpenCV's KNearest model on them.
          - paragraph [ref=e258]: To classify a digit it finds the k training images closest to it and takes a vote. The script then plots test digits with their true label and the model's prediction so you can see exactly where it gets fooled.
