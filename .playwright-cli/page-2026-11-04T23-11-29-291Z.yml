        - generic [ref=e77]:
          - paragraph [ref=e78]: A grabber for seniors that extends on its own, so picking something up never means bending, stretching or squeezing. Our four-person team built it for Project Invent with Mozaic Senior Life, after hearing that residents were losing grip strength to arthritis.
          - paragraph [ref=e79]: "I owned the mechanical design and fabrication: the CAD, the printing and the telescoping mechanism. Six months and three versions later, Reach won the Product Pivot award at Project Invent, and version 0.3 is being refined to go to residents."
          - list "Tools used" [ref=e80]:
            - listitem [ref=e81]: Onshape CAD
            - listitem [ref=e82]: 3D printing (PETG)
            - listitem [ref=e83]: N20 gear motor
            - listitem [ref=e84]: Joystick + motor controller
            - listitem [ref=e85]: Lead-screw mechanism
        - generic [ref=e87]:
          - heading "How it works" [level=4] [ref=e88]
          - list [ref=e89]:
            - listitem [ref=e90]: An N20 gear motor spins a lead screw. The connector riding on it can't rotate, so the thread drives it upward and the next stage climbs out of the one below
            - listitem [ref=e91]: Twin lead screws per connector stop it from spinning and leave a channel down the middle for wires
            - listitem [ref=e92]: 3 mm steel balls in a printed race let lead screw B spin freely without pulling out
            - listitem [ref=e93]: A four-bar linkage closes Fin Ray fingers in a straight line, run from a joystick through a motor controller on a 6 V LiPo battery
      - generic [ref=e94]:
        - generic [ref=e95]:
          - generic [ref=e96]: Feb 6, 2026
          - heading "Proof of concept" [level=5] [ref=e97]
          - paragraph [ref=e98]: A drill stands in for the motor. After tolerance tests set a 1.5 mm thread offset, the printed lead screws extend exactly as planned.
          - generic [ref=e99]: Worked
        - generic [ref=e100]:
          - generic [ref=e101]: Version 0.0
          - heading "Retired for safety" [level=5] [ref=e102]
